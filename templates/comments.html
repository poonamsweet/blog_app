<!doctype html>
<html>
  <head>
    <title>Comments</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f7fb;
      }

      .page-header {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        padding: 35px 0;
        margin-bottom: 30px;
        text-align: center;
        border-radius: 0 0 20px 20px;
      }

      .comment-card {
        border: none;
        border-radius: 12px;
        transition: 0.3s;
      }

      .comment-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      }

      .badge-post {
        background: #e0f3ff;
        color: #0077b6;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 20px;
      }

      .comment-name {
        font-weight: 600;
        color: #2c3e50;
      }

      .comment-text {
        color: #6c757d;
        margin-top: 5px;
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <div class="page-header">
      <h1>💬 Comments</h1>
      <p>User discussions and feedback</p>
    </div>

    <div class="container">
      <div class="row">
        {% for comment in comments %}
        <div class="col-md-6 mb-4">
          <div class="card comment-card p-3 h-100">
            <span class="badge-post mb-2">
              Post ID: {{ comment.post_id }}
            </span>

            <div class="comment-name">👤 {{ comment.name }}</div>

            <div class="comment-text">{{ comment.text }}</div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
