<!doctype html>
<html>
  <head>
    <title>Posts</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f7fb;
      }

      .page-header {
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        color: white;
        padding: 40px 0;
        margin-bottom: 30px;
        text-align: center;
        border-radius: 0 0 20px 20px;
      }

      .card {
        border: none;
        border-radius: 12px;
        transition: 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      }

      .tag {
        display: inline-block;
        font-size: 12px;
        background: #e0f3ff;
        color: #0077b6;
        padding: 3px 10px;
        border-radius: 20px;
        margin-bottom: 10px;
      }

      .card-title {
        font-weight: 600;
        color: #2c3e50;
      }

      .card-text {
        color: #6c757d;
      }

      .btn-sm-custom {
        background: #4facfe;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 13px;
        text-decoration: none;
        display: inline-block;
        margin-top: 10px;
      }

      .btn-sm-custom:hover {
        background: #009ffd;
        color: white;
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <div class="page-header">
      <h1>📝 Blog Posts</h1>
      <p>Explore latest articles and tutorials</p>
    </div>

    <div class="container">
      <div class="row">
        {% for post in posts %}
        <div class="col-md-6 col-lg-4 mb-4">
          <div class="card p-3 h-100">
            <div class="tag">Article</div>

            <h5 class="card-title">{{ post.title }}</h5>
            <p class="card-text">{{ post.summary }}</p>

            <a href="#" class="btn-sm-custom">Read More →</a>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
